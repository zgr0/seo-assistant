# Haftalik bagimlilik guncellemeleri. Minor/patch'ler ekosistem basina tek PR'da toplanir.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        update-types: [minor, patch]
    ignore:
      # Bu paketlerin major surumu .NET major surumune bagli (net10.0 → net11.0);
      # TargetFramework ile birlikte elle yukseltilir.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/SeoCopilot.Web
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /src/SeoCopilot.Api
      - /src/SeoCopilot.Web
    schedule:
      interval: weekly
    ignore:
      # Temel imaj major'u (dotnet 10 → 11, node 22 → 24) elle yukseltilir.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
